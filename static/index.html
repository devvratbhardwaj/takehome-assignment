<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory Assistant</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f4f5f7;
    color: #1a202c;
    height: 100dvh;
    display: flex;
    justify-content: center;
  }
  main {
    width: 100%;
    max-width: 680px;
    display: flex;
    flex-direction: column;
    background: #fff;
    box-shadow: 0 0 24px rgba(0, 0, 0, 0.06);
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid #e2e8f0;
  }
  header h1 { font-size: 17px; font-weight: 600; }
  header p { font-size: 13px; color: #64748b; margin-top: 2px; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }
  .user {
    align-self: flex-end;
    background: #1e5aa8;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .assistant {
    align-self: flex-start;
    background: #eef1f5;
    border-bottom-left-radius: 4px;
  }
  .error {
    align-self: center;
    background: #fdecec;
    color: #b3261e;
    font-size: 13px;
  }
  .pending { color: #64748b; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.45; } }
  form {
    display: flex;
    gap: 8px;
    padding: 14px 20px;
    border-top: 1px solid #e2e8f0;
  }
  input {
    flex: 1;
    padding: 10px 14px;
    font: inherit;
    font-size: 14px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    outline: none;
  }
  input:focus { border-color: #1e5aa8; }
  button {
    padding: 10px 18px;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    background: #1e5aa8;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  button:disabled, input:disabled { opacity: 0.55; cursor: default; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Inventory Assistant</h1>
    <p>Check stock, look up suppliers, place orders.</p>
  </header>
  <div id="messages"></div>
  <form id="chat-form">
    <input id="chat-input" placeholder="e.g. How many 15M rebar do we have?" autocomplete="off" autofocus>
    <button id="send">Send</button>
  </form>
</main>
<script>
  const history = [];
  const messages = document.getElementById("messages");
  const form = document.getElementById("chat-form");
  const input = document.getElementById("chat-input");
  const send = document.getElementById("send");

  function addMessage(className, text) {
    const el = document.createElement("div");
    el.className = "msg " + className;
    el.textContent = text;
    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
    return el;
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const message = input.value.trim();
    if (!message) return;

    addMessage("user", message);
    input.value = "";
    input.disabled = send.disabled = true;
    const pending = addMessage("assistant pending", "Thinking…");

    try {
      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, history }),
      });
      if (!response.ok) throw new Error("HTTP " + response.status);
      const data = await response.json();
      pending.remove();
      addMessage("assistant", data.reply);
      history.push(
        { role: "user", content: message },
        { role: "assistant", content: data.reply },
      );
    } catch {
      pending.remove();
      addMessage("error", "Something went wrong — please try again.");
    } finally {
      input.disabled = send.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
